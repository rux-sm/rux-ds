<section class="ks-sec" id="combo-button">
  <h2>Combo button</h2><p>primary action plus a menu trigger</p>
  <div class="ks-row">
    <div class="rux--combo-button__container rux--combo-button__container--lg">
      <button type="button" class="rux--btn rux--btn--primary rux--combo-button__primary-action">Save</button>
      <button type="button" class="rux--btn rux--btn--primary rux--combo-button__trigger" aria-haspopup="true" aria-expanded="false" aria-label="More save options"><svg width="16" height="16" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><use href="#i-chevron--down"/></svg></button>
    </div>
    <div class="rux--combo-button__container rux--combo-button__container--sm">
      <button type="button" class="rux--btn rux--btn--primary rux--combo-button__primary-action">Small</button>
      <button type="button" class="rux--btn rux--btn--primary rux--combo-button__trigger" aria-haspopup="true" aria-expanded="false" aria-label="More options"><svg width="16" height="16" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><use href="#i-chevron--down"/></svg></button>
    </div>
  </div>
</section>
