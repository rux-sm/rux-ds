<section class="ks-sec" id="breadcrumb">
  <h2>Breadcrumb</h2><p>trailing slash · no trailing slash · small</p>
  <!-- PROVENANCE: inferred · structure read off CSS selectors, never diffed against a reference -->
  <!-- The separator is ::after on every item; --no-trailing-slash suppresses the last. -->
  <div style="display:grid;gap:1rem">
    <nav aria-label="Breadcrumb">
      <ol class="rux--breadcrumb">
        <li class="rux--breadcrumb-item"><a class="rux--link" href="#breadcrumb">Home</a></li>
        <li class="rux--breadcrumb-item"><a class="rux--link" href="#breadcrumb">Section</a></li>
        <li class="rux--breadcrumb-item rux--breadcrumb-item--current"><a class="rux--link" href="#breadcrumb" aria-current="page">Current</a></li>
      </ol>
    </nav>
    <nav aria-label="Breadcrumb, no trailing slash">
      <ol class="rux--breadcrumb rux--breadcrumb--no-trailing-slash">
        <li class="rux--breadcrumb-item"><a class="rux--link" href="#breadcrumb">Home</a></li>
        <li class="rux--breadcrumb-item"><a class="rux--link" href="#breadcrumb">Section</a></li>
        <li class="rux--breadcrumb-item rux--breadcrumb-item--current"><a class="rux--link" href="#breadcrumb" aria-current="page">Current</a></li>
      </ol>
    </nav>
    <nav aria-label="Breadcrumb, small">
      <ol class="rux--breadcrumb rux--breadcrumb--sm rux--breadcrumb--no-trailing-slash">
        <li class="rux--breadcrumb-item"><a class="rux--link" href="#breadcrumb">Home</a></li>
        <li class="rux--breadcrumb-item rux--breadcrumb-item--current"><a class="rux--link" href="#breadcrumb" aria-current="page">Current</a></li>
      </ol>
    </nav>
  </div>
</section>
