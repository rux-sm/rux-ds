<section class="ks-sec" id="content-switcher">
  <h2>Content switcher</h2><p>sizes · selected state</p>
  <!-- PROVENANCE: inferred · structure read off CSS selectors, never diffed against a reference -->
  <div class="ks-row">
    <div class="rux--content-switcher rux--content-switcher--sm" role="tablist">
      <button type="button" class="rux--content-switcher-btn rux--content-switcher--selected" role="tab" aria-selected="true">
        <span class="rux--content-switcher__label">First</span>
      </button>
      <button type="button" class="rux--content-switcher-btn" role="tab" aria-selected="false">
        <span class="rux--content-switcher__label">Second</span>
      </button>
      <button type="button" class="rux--content-switcher-btn" role="tab" aria-selected="false">
        <span class="rux--content-switcher__label">Third</span>
      </button>
    </div>
  </div>
  <!--
    --content-switcher-popover--disabled sits on the __wrapper, never on the
    button: every rule reads it as `.__wrapper:not(.popover--disabled)` or as the
    sibling of a selected wrapper.
  -->
  <div class="ks-row">
    <div class="rux--content-switcher rux--content-switcher--icon-only rux--content-switcher--sm" role="tablist">
      <div class="rux--content-switcher-popover__wrapper rux--content-switcher-popover--selected">
        <button type="button" class="rux--content-switcher-btn rux--content-switcher--selected" role="tab" aria-selected="true" aria-label="List view">
          <svg width="16" height="16" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><use href="#i-list"/></svg>
        </button>
      </div>
      <div class="rux--content-switcher-popover__wrapper">
        <button type="button" class="rux--content-switcher-btn" role="tab" aria-selected="false" aria-label="Grid view">
          <svg width="16" height="16" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><use href="#i-grid"/></svg>
        </button>
      </div>
      <div class="rux--content-switcher-popover__wrapper rux--content-switcher-popover--disabled">
        <button type="button" class="rux--content-switcher-btn" role="tab" aria-selected="false" aria-label="Map view" disabled>
          <svg width="16" height="16" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><use href="#i-location"/></svg>
        </button>
      </div>
    </div>
  </div>

  <div class="ks-row">
    <div class="rux--content-switcher rux--content-switcher--lg" role="tablist">
      <button type="button" class="rux--content-switcher-btn rux--content-switcher--selected" role="tab" aria-selected="true">
        <span class="rux--content-switcher__label">Large</span>
      </button>
      <button type="button" class="rux--content-switcher-btn" role="tab" aria-selected="false">
        <span class="rux--content-switcher__label">Switcher</span>
      </button>
    </div>
  </div>
</section>
