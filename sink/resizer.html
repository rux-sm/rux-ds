<section class="ks-sec" id="resizer">
  <h2>Resizer</h2><p>split-pane handles — no intrinsic size, they take it from the flex container</p>
  <div class="ks-row">
    <div>
      <div class="ks-label">vertical handle · ew-resize · between side-by-side panes</div>
      <div style="display:flex;inline-size:22rem;block-size:6rem;border:1px solid var(--rux-border-subtle)">
        <div class="ks-box" style="flex:1">Left</div>
        <div class="rux--resizer rux--resizer--vertical" style="inline-size:4px" role="separator" tabindex="0" aria-orientation="vertical"></div>
        <div class="ks-box" style="flex:1">Right</div>
      </div>
    </div>
    <div>
      <div class="ks-label">horizontal handle · ns-resize · between stacked panes</div>
      <div style="display:flex;flex-direction:column;inline-size:22rem;block-size:6rem;border:1px solid var(--rux-border-subtle)">
        <div class="ks-box" style="flex:1">Top</div>
        <div class="rux--resizer rux--resizer--horizontal" style="block-size:4px" role="separator" tabindex="0" aria-orientation="horizontal"></div>
        <div class="ks-box" style="flex:1">Bottom</div>
      </div>
    </div>
  </div>
</section>
