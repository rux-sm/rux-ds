<section class="ks-sec" id="stack">
  <h2>Stack</h2><p>vertical · horizontal · spacing scale</p>
  <!-- PROVENANCE: rendered-dom · layout-stack--default and --horizontal,
       2026-08-28 · diffed clean -->
  <!--
    The nesting report flags the buttons inside these stacks, because every
    button the reference stacks lives in an action-set. Putting arbitrary
    children in a stack IS the component, so the finding is a limit of pooling
    rather than a defect. `stack-scale-6` is one more step on the same scale as
    the 3 and 5 demoed here.
  -->
  <div class="ks-row">
    <div class="ks-box">
      <div class="ks-label">vertical · scale 5</div>
      <div class="rux--stack-vertical rux--stack-scale-5">
        <button type="button" class="rux--btn rux--btn--primary rux--btn--sm rux--layout--size-sm">One</button>
        <button type="button" class="rux--btn rux--btn--secondary rux--btn--sm rux--layout--size-sm">Two</button>
        <button type="button" class="rux--btn rux--btn--tertiary rux--btn--sm rux--layout--size-sm">Three</button>
      </div>
    </div>
    <div class="ks-box">
      <div class="ks-label">horizontal · scale 3</div>
      <div class="rux--stack-horizontal rux--stack-scale-3">
        <button type="button" class="rux--btn rux--btn--primary rux--btn--sm rux--layout--size-sm">One</button>
        <button type="button" class="rux--btn rux--btn--secondary rux--btn--sm rux--layout--size-sm">Two</button>
      </div>
    </div>
  </div>
</section>
