<section class="ks-sec" id="progress-indicator">
  <h2>Progress indicator</h2><p>horizontal · vertical · step states</p>
  <!-- PROVENANCE: rendered-dom · components-progressindicator--default and its
       vertical / space-equal recipes, plus --interactive, 2026-08-27 -->
  <!--
    Corrected against the reference 2026-08-27. The label and the optional text
    are not siblings of the icon: Carbon wraps both in `progress-text`, with
    `progress-label` and `progress-optional` as spans inside it, and closes each
    step with `progress-line` — the rule that draws the connector between steps.
    This fragment had the label as a bare <p> and the optional text loose in the
    step button, where css/rux.css cannot reach either.
  -->
  <ul class="rux--progress rux--progress--space-equal" style="margin-block-end:2rem">
    <li class="rux--progress-step rux--progress-step--complete">
      <div class="rux--progress-step-button">
        <svg width="16" height="16" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><use href="#i-checkmark--outline"/></svg>
        <div class="rux--progress-text"><span class="rux--progress-label">Details</span></div><span class="rux--progress-line"></span>
      </div>
    </li>
    <li class="rux--progress-step rux--progress-step--current">
      <div class="rux--progress-step-button">
        <svg width="16" height="16" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><use href="#i-incomplete"/></svg>
        <div class="rux--progress-text">
          <span class="rux--progress-label">Review</span>
          <span class="rux--progress-optional">Optional</span>
        </div>
        <span class="rux--progress-line"></span>
      </div>
    </li>
    <li class="rux--progress-step rux--progress-step--incomplete">
      <div class="rux--progress-step-button">
        <svg width="16" height="16" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><use href="#i-circle-dash"/></svg>
        <div class="rux--progress-text"><span class="rux--progress-label">Confirm</span></div><span class="rux--progress-line"></span>
      </div>
    </li>
    <li class="rux--progress-step rux--progress-step--incomplete rux--progress-step--disabled" aria-disabled="true">
      <div class="rux--progress-step-button">
        <svg width="16" height="16" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><use href="#i-circle-dash"/></svg>
        <div class="rux--progress-text"><span class="rux--progress-label">Publish</span></div><span class="rux--progress-line"></span>
      </div>
    </li>
  </ul>
  <ul class="rux--progress rux--progress--vertical">
    <li class="rux--progress-step rux--progress-step--complete">
      <div class="rux--progress-step-button"><svg width="16" height="16" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><use href="#i-checkmark--outline"/></svg><div class="rux--progress-text"><span class="rux--progress-label">One</span></div><span class="rux--progress-line"></span></div>
    </li>
    <li class="rux--progress-step rux--progress-step--current">
      <div class="rux--progress-step-button"><svg width="16" height="16" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><use href="#i-incomplete"/></svg><div class="rux--progress-text"><span class="rux--progress-label">Two</span></div><span class="rux--progress-line"></span></div>
    </li>
  </ul>
</section>
