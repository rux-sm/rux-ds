<section class="ks-sec" id="contained-list">
  <h2>Contained list</h2><p>on-page · disclosed · item variants</p>
  <!-- PROVENANCE: inferred · structure read off CSS selectors, never diffed against a reference -->
  <!--
    DELIBERATE divergence, kept against the reference: Carbon renders
    __label on a <div>; this system uses <h3> — a contained list's label
    is a heading, and the heading level gives screen-reader users the
    outline Carbon reconstructs with ARIA instead. Applies to both lists
    below. check-tags reports it by design.
  -->
  <div class="ks-grid">
    <div class="rux--contained-list rux--contained-list--on-page">
      <div class="rux--contained-list__header"><h3 class="rux--contained-list__label">On page</h3></div>
      <ul>
        <li class="rux--contained-list-item">
          <div class="rux--contained-list-item__content">First item</div>
        </li>
        <li class="rux--contained-list-item rux--contained-list-item--with-action">
          <div class="rux--contained-list-item__content">With action</div>
          <div class="rux--contained-list-item__action">
            <button type="button" class="rux--btn rux--btn--ghost rux--btn--sm rux--layout--size-sm">Edit</button>
          </div>
        </li>
        <li class="rux--contained-list-item rux--contained-list-item--clickable">
          <button type="button" class="rux--contained-list-item__content">Clickable item</button>
        </li>
      </ul>
    </div>
    <div class="rux--contained-list rux--contained-list--disclosed rux--contained-list--inset-rulers">
      <div class="rux--contained-list__header"><h3 class="rux--contained-list__label">Disclosed</h3></div>
      <ul>
        <li class="rux--contained-list-item"><div class="rux--contained-list-item__content">Alpha</div></li>
        <li class="rux--contained-list-item"><div class="rux--contained-list-item__content">Bravo</div></li>
      </ul>
    </div>
  </div>
</section>
