<section class="ks-sec" id="progress-bar">
  <h2>Progress bar</h2><p>determinate · indeterminate · finished · error</p>
  <!-- PROVENANCE: inferred · structure read off CSS selectors, never diffed against a reference -->
  <div style="max-width:28rem;display:grid;gap:1.5rem">
    <div class="rux--progress-bar rux--progress-bar--big">
      <div class="rux--progress-bar__label"><span class="rux--progress-bar__label-text">Uploading</span></div>
      <div class="rux--progress-bar__track"><div class="rux--progress-bar__bar" style="transform:scaleX(0.42)"></div></div>
      <div class="rux--progress-bar__helper-text">42%</div>
    </div>
    <div class="rux--progress-bar rux--progress-bar--small rux--progress-bar--indeterminate">
      <div class="rux--progress-bar__label"><span class="rux--progress-bar__label-text">Working</span></div>
      <div class="rux--progress-bar__track"><div class="rux--progress-bar__bar"></div></div>
    </div>
    <div class="rux--progress-bar rux--progress-bar--finished">
      <div class="rux--progress-bar__label"><span class="rux--progress-bar__label-text">Complete</span></div>
      <div class="rux--progress-bar__track"><div class="rux--progress-bar__bar"></div></div>
      <div class="rux--progress-bar__helper-text">Done</div>
    </div>
    <div class="rux--progress-bar rux--progress-bar--error">
      <div class="rux--progress-bar__label"><span class="rux--progress-bar__label-text">Failed</span></div>
      <div class="rux--progress-bar__track"><div class="rux--progress-bar__bar"></div></div>
      <div class="rux--progress-bar__helper-text">Upload failed</div>
    </div>
  </div>
</section>
