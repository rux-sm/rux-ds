<section class="ks-sec" id="combo-box">
  <h2>Combo box</h2><p>filterable input over a list box</p>
  <!--
    From cds-combo-box's shadow DOM. The root carries BOTH `--dropdown` and
    `--combo-box`, and the input is `cds--text-input cds--text-input--empty`.
    NOTE: cds-dropdown emits `--list-box--md`, but @carbon/styles defines NO rule
    for it — the styled size classes are `--dropdown--lg` / `--dropdown--sm`. The
    web components are authoritative for STRUCTURE, not for which classes are
    styled; always confirm against the compiled CSS.
  -->
  <div class="ks-grid">
    <div>
      <label class="rux--label" for="cbx-1">Filter and choose</label>
      <div class="rux--dropdown rux--list-box rux--dropdown--lg rux--layout--size-lg rux--combo-box">
        <div class="rux--list-box__field">
          <input id="cbx-1" class="rux--text-input rux--text-input--empty" type="text" role="combobox"
                 aria-expanded="false" aria-autocomplete="list" placeholder="Type to filter…">
          <div class="rux--list-box__menu-icon">
            <svg width="16" height="16" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><use href="#i-chevron--down"/></svg>
          </div>
        </div>
        <div class="rux--list-box__menu" role="listbox" tabindex="-1" hidden></div>
      </div>
    </div>
    <div>
      <label class="rux--label" for="cbx-2">Readonly</label>
      <div class="rux--dropdown rux--list-box rux--dropdown--lg rux--layout--size-lg rux--combo-box rux--combo-box--readonly">
        <div class="rux--list-box__field">
          <input id="cbx-2" class="rux--text-input" type="text" role="combobox" value="Locked" readonly>
          <div class="rux--list-box__menu-icon">
            <svg width="16" height="16" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><use href="#i-chevron--down"/></svg>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
