<section class="ks-sec" id="grid">
  <h2>Grid</h2><p>16 columns · spans · condensed · narrow</p>
  <!--
    .rux--css-grid sets grid-template-columns: repeat(var(--rux-grid-columns),
    minmax(0,1fr)) and --rux-grid-columns is set responsively (4 / 8 / 16).
    Column tokens are emitted by @carbon/grid as literal --cds-grid-* names, which
    tools/build.mjs renames; see roadmap §4.1.2.
  -->
  <div class="ks-label">all 16 columns, one span each</div>
  <div class="rux--css-grid" style="margin-block-end:1.5rem">
    <div class="rux--css-grid-column rux--col-span-1 ks-box" style="padding:.5rem;text-align:center">1</div>
    <div class="rux--css-grid-column rux--col-span-1 ks-box" style="padding:.5rem;text-align:center">2</div>
    <div class="rux--css-grid-column rux--col-span-1 ks-box" style="padding:.5rem;text-align:center">3</div>
    <div class="rux--css-grid-column rux--col-span-1 ks-box" style="padding:.5rem;text-align:center">4</div>
    <div class="rux--css-grid-column rux--col-span-1 ks-box" style="padding:.5rem;text-align:center">5</div>
    <div class="rux--css-grid-column rux--col-span-1 ks-box" style="padding:.5rem;text-align:center">6</div>
    <div class="rux--css-grid-column rux--col-span-1 ks-box" style="padding:.5rem;text-align:center">7</div>
    <div class="rux--css-grid-column rux--col-span-1 ks-box" style="padding:.5rem;text-align:center">8</div>
    <div class="rux--css-grid-column rux--col-span-1 ks-box" style="padding:.5rem;text-align:center">9</div>
    <div class="rux--css-grid-column rux--col-span-1 ks-box" style="padding:.5rem;text-align:center">10</div>
    <div class="rux--css-grid-column rux--col-span-1 ks-box" style="padding:.5rem;text-align:center">11</div>
    <div class="rux--css-grid-column rux--col-span-1 ks-box" style="padding:.5rem;text-align:center">12</div>
    <div class="rux--css-grid-column rux--col-span-1 ks-box" style="padding:.5rem;text-align:center">13</div>
    <div class="rux--css-grid-column rux--col-span-1 ks-box" style="padding:.5rem;text-align:center">14</div>
    <div class="rux--css-grid-column rux--col-span-1 ks-box" style="padding:.5rem;text-align:center">15</div>
    <div class="rux--css-grid-column rux--col-span-1 ks-box" style="padding:.5rem;text-align:center">16</div>
  </div>

  <div class="ks-label">spans — 4 · 4 · 8</div>
  <div class="rux--css-grid" style="margin-block-end:1.5rem">
    <div class="rux--css-grid-column rux--col-span-4 ks-box" style="padding:1rem">4 columns</div>
    <div class="rux--css-grid-column rux--col-span-4 ks-box" style="padding:1rem">4 columns</div>
    <div class="rux--css-grid-column rux--col-span-8 ks-box" style="padding:1rem">8 columns</div>
  </div>

  <div class="ks-label">condensed — 1px gutters</div>
  <div class="rux--css-grid rux--css-grid--condensed" style="margin-block-end:1.5rem">
    <div class="rux--css-grid-column rux--col-span-8 ks-box" style="padding:1rem">8</div>
    <div class="rux--css-grid-column rux--col-span-8 ks-box" style="padding:1rem">8</div>
  </div>

  <div class="ks-label">narrow — gutter pulled to the left of the column</div>
  <div class="rux--css-grid rux--css-grid--narrow">
    <div class="rux--css-grid-column rux--col-span-8 ks-box" style="padding:1rem">8</div>
    <div class="rux--css-grid-column rux--col-span-8 ks-box" style="padding:1rem">8</div>
  </div>
</section>
