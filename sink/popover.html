<section class="ks-sec" id="popover">
  <h2>Popover</h2><p>caret · drop shadow · placements — click a trigger</p>
  <!-- PROVENANCE: rendered-dom · components-popover--default, --tab-tip and
       the auto-align stories, 2026-08-28 -->
  <!--
    DELIBERATE divergence, recorded: Carbon's popover story triggers from a bare
    unclassed <button> holding an icon. This demo triggers from a real
    `btn btn--sm btn--tertiary`, which is what a page would actually use and
    what makes the trigger visible in the sink. Every nesting finding here is
    that one choice, reported once per button.
  -->
  <div class="ks-row" style="gap:6rem;padding:3rem 0 5rem 8rem">
    <span class="rux--popover-container rux--popover--bottom rux--popover--caret rux--popover--drop-shadow">
      <button type="button" class="rux--btn rux--btn--tertiary rux--btn--sm rux--layout--size-sm">Bottom</button>
      <span class="rux--popover">
        <span class="rux--popover-content rux--popover--high-contrast">
          Popover content, bottom aligned.
        </span>
        <span class="rux--popover-caret"></span>
      </span>
    </span>
    <span class="rux--popover-container rux--popover--top rux--popover--caret rux--popover--drop-shadow">
      <button type="button" class="rux--btn rux--btn--tertiary rux--btn--sm rux--layout--size-sm">Top</button>
      <span class="rux--popover">
        <span class="rux--popover-content">Top aligned.</span>
        <span class="rux--popover-caret"></span>
      </span>
    </span>
  </div>
</section>
