<section class="ks-sec" id="copy-button">
  <h2>Copy button</h2><p>click to see the feedback animation</p>
  <!-- PROVENANCE: rendered-dom · components-copybutton--default and its
       copied recipe, 2026-08-28 -->
  <!--
    .rux--copy-btn__feedback has no hidden state in CSS — Carbon's web component
    only puts it in the DOM while animating. The idle button therefore omits it.

    THE COPY BUTTON IS A BUTTON. The reference renders
    `copy-btn copy btn btn--primary btn--icon-only`, and this fragment carried
    only the first two, so the button had no box, no kind and no icon-only
    sizing — the same defect the icon-only content switcher had. Its icon is
    `snippet__icon`, which is what sizes and centres the glyph.

    Not copied: the icon-tooltip popover the story wraps it in. The sink demos
    the component, not the story's hover hint (as with combo-button).
  -->
  <div class="ks-row" style="gap:4rem;padding-block:1rem 2rem">
    <button type="button" class="rux--copy-btn rux--copy rux--btn rux--btn--primary rux--btn--icon-only" aria-label="Copy to clipboard">
      <svg class="rux--snippet__icon" width="16" height="16" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><use href="#i-copy"/></svg>
    </button>
    <button type="button" class="rux--copy-btn rux--copy rux--btn rux--btn--primary rux--btn--icon-only rux--copy-btn--animating rux--copy-btn--fade-in" aria-label="Copy to clipboard">
      <svg class="rux--snippet__icon" width="16" height="16" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><use href="#i-copy"/></svg>
      <span class="rux--copy-btn__feedback">Copied!</span>
    </button>
    <span class="ks-label">↑ held in the animating state so it is visible at rest</span>
  </div>
</section>
