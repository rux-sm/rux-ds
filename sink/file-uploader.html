<section class="ks-sec" id="file-uploader">
  <h2>File uploader</h2><p>drop zone · browse · uploaded items</p>
  <!-- PROVENANCE: inferred · structure read off CSS selectors, never diffed against a reference -->
  <div style="max-width:32rem">
    <p class="rux--file--label">Upload files</p>
    <p class="rux--label-description">Max 500 KB each</p>
    <div class="rux--file">
      <label class="rux--file-browse-btn" for="fu-1">
        <div class="rux--file__drop-container">Drag and drop files here or click to upload</div>
      </label>
      <input id="fu-1" type="file" class="rux--visually-hidden" multiple>
      <div class="rux--file-container">
        <span class="rux--file__selected-file rux--file__selected-file--md">
          <p class="rux--file-filename">report-q3.pdf</p>
          <span class="rux--file__state-container">
            <div class="rux--file-complete"><svg width="16" height="16" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><use href="#i-checkmark--filled"/></svg></div>
          </span>
        </span>
        <span class="rux--file__selected-file rux--file__selected-file--md rux--file__selected-file--invalid">
          <p class="rux--file-filename">too-large.zip</p>
          <span class="rux--file__state-container"><div class="rux--file-close"><svg width="16" height="16" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><use href="#i-close"/></svg></div></span>
        </span>
      </div>
    </div>
  </div>
</section>
