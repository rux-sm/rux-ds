<section class="ks-sec" id="search">
  <h2>Search</h2><p>sizes · with close · disabled</p>
  <!-- PROVENANCE: inferred · structure read off CSS selectors, never diffed against a reference -->
  <div style="display:grid;gap:1.5rem;max-width:34rem">
    <div class="rux--search rux--layout--size-lg">
      <label class="rux--label" for="sr-1">Large</label>
      <svg class="rux--search-magnifier-icon" width="16" height="16" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><use href="#i-search"/></svg>
      <input id="sr-1" class="rux--search-input" type="text" role="searchbox" placeholder="Search…">
      <button type="button" class="rux--search-close rux--search-close--hidden" aria-label="Clear">
        <svg width="16" height="16" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><use href="#i-close"/></svg>
      </button>
    </div>
    <div class="rux--search rux--layout--size-md">
      <label class="rux--label" for="sr-2">Medium · with value</label>
      <svg class="rux--search-magnifier-icon" width="16" height="16" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><use href="#i-search"/></svg>
      <input id="sr-2" class="rux--search-input" type="text" role="searchbox" value="query">
      <button type="button" class="rux--search-close" aria-label="Clear">
        <svg width="16" height="16" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><use href="#i-close"/></svg>
      </button>
    </div>
    <div class="rux--search rux--layout--size-sm rux--search--disabled">
      <label class="rux--label rux--label--disabled" for="sr-3">Small · disabled</label>
      <svg class="rux--search-magnifier-icon" width="16" height="16" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><use href="#i-search"/></svg>
      <input id="sr-3" class="rux--search-input" type="text" role="searchbox" placeholder="Search…" disabled>
    </div>
  </div>
</section>
