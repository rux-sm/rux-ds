<section class="ks-sec" id="icon-indicator">
  <h2>Icon indicator</h2><p>status set · 16 and 20px</p>
  <!-- Icon per status from web-components/icon-indicator.js:50-97. -->
  <div class="ks-row">
    <div class="rux--icon-indicator rux--icon-indicator--failed"><svg width="16" height="16" viewBox="0 0 32 32" aria-hidden="true"><use href="#i-error--filled"/></svg>Failed</div>
    <div class="rux--icon-indicator rux--icon-indicator--caution-major"><svg width="16" height="16" viewBox="0 0 32 32" aria-hidden="true"><use href="#i-warning--alt-inverted--filled"/></svg>Caution major</div>
    <div class="rux--icon-indicator rux--icon-indicator--caution-minor"><svg width="16" height="16" viewBox="0 0 32 32" aria-hidden="true"><use href="#i-warning--alt--filled"/></svg>Caution minor</div>
    <div class="rux--icon-indicator rux--icon-indicator--undefined"><svg width="16" height="16" viewBox="0 0 32 32" aria-hidden="true"><use href="#i-undefined--filled"/></svg>Undefined</div>
    <div class="rux--icon-indicator rux--icon-indicator--succeeded"><svg width="16" height="16" viewBox="0 0 32 32" aria-hidden="true"><use href="#i-checkmark--filled"/></svg>Succeeded</div>
    <div class="rux--icon-indicator rux--icon-indicator--normal"><svg width="16" height="16" viewBox="0 0 32 32" aria-hidden="true"><use href="#i-checkmark--outline"/></svg>Normal</div>
    <div class="rux--icon-indicator rux--icon-indicator--in-progress"><svg width="16" height="16" viewBox="0 0 32 32" aria-hidden="true"><use href="#i-in-progress"/></svg>In progress</div>
    <div class="rux--icon-indicator rux--icon-indicator--incomplete"><svg width="16" height="16" viewBox="0 0 32 32" aria-hidden="true"><use href="#i-incomplete"/></svg>Incomplete</div>
    <div class="rux--icon-indicator rux--icon-indicator--not-started"><svg width="16" height="16" viewBox="0 0 32 32" aria-hidden="true"><use href="#i-circle-dash"/></svg>Not started</div>
    <div class="rux--icon-indicator rux--icon-indicator--pending"><svg width="16" height="16" viewBox="0 0 32 32" aria-hidden="true"><use href="#i-pending--filled"/></svg>Pending</div>
    <div class="rux--icon-indicator rux--icon-indicator--unknown"><svg width="16" height="16" viewBox="0 0 32 32" aria-hidden="true"><use href="#i-unknown--filled"/></svg>Unknown</div>
    <div class="rux--icon-indicator rux--icon-indicator--informative"><svg width="16" height="16" viewBox="0 0 32 32" aria-hidden="true"><use href="#i-warning-square--filled"/></svg>Informative</div>
  </div>
  <div class="ks-label">20px</div>
  <div class="ks-row">
    <div class="rux--icon-indicator rux--icon-indicator--failed rux--icon-indicator--20"><svg width="20" height="20" viewBox="0 0 32 32" aria-hidden="true"><use href="#i-error--filled"/></svg>Failed</div>
    <div class="rux--icon-indicator rux--icon-indicator--caution-major rux--icon-indicator--20"><svg width="20" height="20" viewBox="0 0 32 32" aria-hidden="true"><use href="#i-warning--alt-inverted--filled"/></svg>Caution major</div>
    <div class="rux--icon-indicator rux--icon-indicator--caution-minor rux--icon-indicator--20"><svg width="20" height="20" viewBox="0 0 32 32" aria-hidden="true"><use href="#i-warning--alt--filled"/></svg>Caution minor</div>
    <div class="rux--icon-indicator rux--icon-indicator--undefined rux--icon-indicator--20"><svg width="20" height="20" viewBox="0 0 32 32" aria-hidden="true"><use href="#i-undefined--filled"/></svg>Undefined</div>
  </div>
</section>
