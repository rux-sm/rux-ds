<section class="ks-sec" id="dialog">
  <h2>Dialog</h2><p>the newer primitive under modal · two-button and three-button footers</p>
  <div class="ks-grid">
    <div class="rux--dialog-container" style="position:relative">
      <div class="rux--dialog__header">
        <p class="rux--dialog-header__label">Section</p>
        <p class="rux--dialog-header__heading">Dialog heading</p>
        <button type="button" class="rux--dialog__close" aria-label="Close" style="position:absolute;inset-block-start:0;inset-inline-end:0"><svg width="20" height="20" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><use href="#i-close"/></svg></button>
      </div>
      <div class="rux--dialog-content">
        <div class="rux--dialog-scroll-content rux--dialog-scroll-content--no-fade">
          <p>Body content for the dialog.</p>
        </div>
      </div>
      <div class="rux--dialog-footer">
        <button type="button" class="rux--btn rux--btn--secondary">Cancel</button>
        <button type="button" class="rux--btn rux--btn--primary">Confirm</button>
      </div>
    </div>
    <div class="rux--dialog-container" style="position:relative">
      <div class="rux--dialog__header">
        <p class="rux--dialog-header__heading">Destructive action</p>
      </div>
      <div class="rux--dialog-content"><p>Danger variant.</p></div>
      <div class="rux--dialog-footer rux--dialog-footer--three-button">
        <button type="button" class="rux--btn rux--btn--ghost">Discard</button>
        <button type="button" class="rux--btn rux--btn--secondary">Cancel</button>
        <button type="button" class="rux--btn rux--btn--danger">Delete</button>
      </div>
    </div>
  </div>
</section>
