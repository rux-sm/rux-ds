<section class="ks-sec" id="dialog">
  <h2>Dialog</h2><p>the newer primitive under modal · two-button and three-button footers</p>
  <!-- PROVENANCE: inferred · structure read off CSS selectors, never diffed against a reference
       · f9f5414 claims a React DOM diff; the fragment records no reference. Compound pair corrected from the CSS. -->
  <div class="ks-grid">
    <div class="rux--dialog-container" style="position:relative">
      <div class="rux--dialog__header">
        <h2 class="rux--dialog-header__label">Section</h2>
        <h2 class="rux--dialog-header__heading">Dialog heading</h2>
        <button type="button" class="rux--dialog__close" aria-label="Close" style="position:absolute;inset-block-start:0;inset-inline-end:0"><svg width="20" height="20" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><use href="#i-close"/></svg></button>
      </div>
      <!--
        Both classes on ONE element, corrected 2026-08-26. Carbon defines
        `.rux--dialog-content.rux--dialog-scroll-content` (:13719) and NO
        descendant form, so nesting them split the pair: `-content` owns
        overflow-y:auto and the grid area (:13647) while `-scroll-content` owns
        the fade mask (:13664). On separate boxes the mask sat on an element that
        does not scroll, so the fade never tracked the scroll position.
      -->
      <div class="rux--dialog-content rux--dialog-scroll-content rux--dialog-scroll-content--no-fade">
        <p>Body content for the dialog.</p>
      </div>
      <div class="rux--dialog-footer">
        <button type="button" class="rux--btn rux--btn--secondary">Cancel</button>
        <button type="button" class="rux--btn rux--btn--primary">Confirm</button>
      </div>
    </div>
    <div class="rux--dialog-container" style="position:relative">
      <div class="rux--dialog__header">
        <h2 class="rux--dialog-header__heading">Destructive action</h2>
      </div>
      <!-- Paired here too, and without --no-fade, so the danger-specific mask
           rule (:13719) is actually exercised by something. -->
      <div class="rux--dialog-content rux--dialog-scroll-content"><p>Danger variant.</p></div>
      <div class="rux--dialog-footer rux--dialog-footer--three-button">
        <button type="button" class="rux--btn rux--btn--ghost">Discard</button>
        <button type="button" class="rux--btn rux--btn--secondary">Cancel</button>
        <button type="button" class="rux--btn rux--btn--danger">Delete</button>
      </div>
    </div>
  </div>
</section>
