<section class="ks-sec" id="pagination">
  <h2>Pagination</h2><p>full bar · nav-only variant</p>
  <!-- PROVENANCE: inferred · structure read off CSS selectors, never diffed against a reference -->
  <div class="rux--pagination" style="margin-block-end:2rem">
    <div class="rux--pagination__left">
      <label class="rux--pagination__text" for="pg-size">Items per page:</label>
      <div class="rux--select rux--select--inline rux--select__item-count">
        <div class="rux--select-input--inline__wrapper">
          <select id="pg-size" class="rux--select-input">
            <option class="rux--select-option" value="10">10</option>
            <option class="rux--select-option" value="20">20</option>
          </select>
          <svg width="16" height="16" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><use href="#i-chevron--down"/></svg>
        </div>
      </div>
      <span class="rux--pagination__items-count rux--pagination__text">1–10 of 84 items</span>
    </div>
    <div class="rux--pagination__right">
      <span class="rux--pagination__text rux--pagination__page-text">of 9 pages</span>
      <button type="button" class="rux--pagination__button" aria-label="Previous page"><svg width="16" height="16" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><use href="#i-caret--left"/></svg></button>
      <button type="button" class="rux--pagination__button" aria-label="Next page"><svg width="16" height="16" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><use href="#i-caret--right"/></svg></button>
    </div>
  </div>
  <nav class="rux--pagination-nav" aria-label="Pagination">
    <ul class="rux--pagination-nav__list">
      <li class="rux--pagination-nav__list-item">
        <button type="button" class="rux--pagination-nav__page rux--pagination-nav__page--direction rux--pagination-nav__page--disabled" aria-label="Previous"><svg width="16" height="16" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><use href="#i-caret--left"/></svg></button>
      </li>
      <li class="rux--pagination-nav__list-item">
        <button type="button" class="rux--pagination-nav__page rux--pagination-nav__page--active">1</button>
      </li>
      <li class="rux--pagination-nav__list-item">
        <button type="button" class="rux--pagination-nav__page">2</button>
      </li>
      <li class="rux--pagination-nav__list-item">
        <button type="button" class="rux--pagination-nav__page">3</button>
      </li>
      <li class="rux--pagination-nav__list-item">
        <button type="button" class="rux--pagination-nav__page rux--pagination-nav__page--direction" aria-label="Next"><svg width="16" height="16" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><use href="#i-caret--right"/></svg></button>
      </li>
    </ul>
  </nav>
</section>
