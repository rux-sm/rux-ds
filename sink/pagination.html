<section class="ks-sec" id="pagination">
  <h2>Pagination</h2><p>full bar</p>
  <!-- PROVENANCE: rendered-dom · components-pagination--default and
       components-paginationnav--default, 2026-08-28 -->
  <!--
    `select__item-count` is not a class on the select: Carbon puts it on a
    `form-item` WRAPPING the select, which is the element its one rule sizes.
    The select inside is a plain inline select, and it keeps its own
    `select-input__wrapper` that this fragment had skipped.

    The root takes `layout--size-md`; `pagination--md` comes with it in the
    reference and is dropped for having no rule (§4.1.12).

    The nav-only variant is GONE from this fragment: `pagination-nav` is a
    SEPARATE component, CUT in Phase 3, so none of its classes has a rule any
    more. Its markup is preserved in sink/deferred/pagination.html's sibling
    history — restoring it means uncommenting `pagination-nav` in src/app.scss.

    TWO WRAPPERS, and this fragment kept neither until check-ancestry found it.
    `pagination__control-buttons` is styled — `.rux--pagination
    .rux--pagination__control-buttons { display: flex }` — so the two buttons
    were laid out by their parent's rules rather than their own. It is back.

    The SECOND wrapper is still declined: the reference nests each button in an
    icon-tooltip, the chrome this sink passes on throughout. Same shape as the
    modal close button, and the same mistake — a note that named the optional
    wrapper and never mentioned the load-bearing one.
  -->
  <div class="rux--pagination rux--layout--size-md" style="margin-block-end:2rem">
    <div class="rux--pagination__left">
      <label class="rux--pagination__text" for="pg-size">Items per page:</label>
      <div class="rux--form-item rux--select__item-count">
        <div class="rux--select rux--select--inline">
          <div class="rux--select-input--inline__wrapper">
            <div class="rux--select-input__wrapper">
              <select id="pg-size" class="rux--select-input">
                <option class="rux--select-option" value="10">10</option>
                <option class="rux--select-option" value="20">20</option>
              </select>
              <svg class="rux--select__arrow" width="16" height="16" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><use href="#i-chevron--down"/></svg>
            </div>
          </div>
        </div>
      </div>
      <span class="rux--pagination__items-count rux--pagination__text">1–10 of 84 items</span>
    </div>
    <div class="rux--pagination__right">
      <span class="rux--pagination__text rux--pagination__page-text">of 9 pages</span>
      <div class="rux--pagination__control-buttons">
        <button type="button" class="rux--pagination__button" aria-label="Previous page"><svg width="16" height="16" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><use href="#i-caret--left"/></svg></button>
        <button type="button" class="rux--pagination__button" aria-label="Next page"><svg width="16" height="16" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><use href="#i-caret--right"/></svg></button>
      </div>
    </div>
  </div>
</section>
