<section class="ks-sec" id="tile">
    <h2>Tile</h2><p>base · clickable</p>
    <!-- PROVENANCE: rendered-dom · components-tile--default, --clickable, --selectable,
         --expandable and --radio, 2026-08-28 -->
    <!--
      The omissions report is dominated by `tile--with-ai-label`, the AI decorator
      variant; those classes belong to the ai-label fragment. The one
      tag-placement divergence is recorded beside the markup it describes,
      below.
    -->
    <div class="ks-grid">
      <div class="rux--tile"><p>Base tile with some content inside it.</p></div>
      <a href="#tile" class="rux--tile rux--tile--clickable"><p>Clickable tile</p></a>
      <!--
        --tile--disabled is only ever written compound with --tile--selectable
        (:.rux--tile--disabled.rux--tile--selectable). On its own it styles
        nothing but a nested checkmark, so both classes go on one element.
        DELIBERATE, against an unsampled reference: check-tags reports
        --tile--disabled on a <label> only because the sole story that
        disables a tile is the feature-flag one, which renders the label
        form. The CLASSIC selectable tile — components-tile--selectable —
        is a div[role=checkbox], and this demo is the classic form.
      -->
      <div class="rux--tile rux--tile--selectable rux--tile--disabled" role="checkbox" aria-checked="false" aria-disabled="true">
        <span class="rux--tile__checkmark"><svg width="16" height="16" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><use href="#i-checkmark--filled"/></svg></span>
        <p>Selectable, disabled</p>
      </div>
    </div>
  </section>
