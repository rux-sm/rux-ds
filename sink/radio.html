<section class="ks-sec" id="radio">
  <h2>Radio button</h2><p>vertical · horizontal · disabled · label placement</p>
  <!-- PROVENANCE: inferred · structure read off CSS selectors, never diffed against a reference -->
  <div class="ks-row" style="gap:4rem">
    <fieldset class="rux--fieldset">
      <legend class="rux--label">Pick one</legend>
      <div class="rux--radio-button-group rux--radio-button-group--vertical">
        <div class="rux--radio-button-wrapper">
          <input id="rb-1" class="rux--radio-button" type="radio" name="rb" checked>
          <label for="rb-1" class="rux--radio-button__label">
            <span class="rux--radio-button__appearance"></span>
            <span class="rux--radio-button__label-text">Selected</span>
          </label>
        </div>
        <div class="rux--radio-button-wrapper">
          <input id="rb-2" class="rux--radio-button" type="radio" name="rb">
          <label for="rb-2" class="rux--radio-button__label">
            <span class="rux--radio-button__appearance"></span>
            <span class="rux--radio-button__label-text">Unselected</span>
          </label>
        </div>
        <div class="rux--radio-button-wrapper">
          <input id="rb-3" class="rux--radio-button" type="radio" name="rb" disabled>
          <label for="rb-3" class="rux--radio-button__label">
            <span class="rux--radio-button__appearance"></span>
            <span class="rux--radio-button__label-text">Disabled</span>
          </label>
        </div>
      </div>
    </fieldset>

    <fieldset class="rux--fieldset">
      <legend class="rux--label">Horizontal</legend>
      <div class="rux--radio-button-group">
        <div class="rux--radio-button-wrapper">
          <input id="rb-4" class="rux--radio-button" type="radio" name="rb2" checked>
          <label for="rb-4" class="rux--radio-button__label">
            <span class="rux--radio-button__appearance"></span>
            <span class="rux--radio-button__label-text">One</span>
          </label>
        </div>
        <div class="rux--radio-button-wrapper">
          <input id="rb-5" class="rux--radio-button" type="radio" name="rb2">
          <label for="rb-5" class="rux--radio-button__label">
            <span class="rux--radio-button__appearance"></span>
            <span class="rux--radio-button__label-text">Two</span>
          </label>
        </div>
      </div>
    </fieldset>
  </div>
</section>
