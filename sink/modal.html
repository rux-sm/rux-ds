<section class="ks-sec" id="modal">
  <h2>Modal</h2><p>sizes · danger footer — opens full-viewport, as Carbon renders it</p>
  <!-- PROVENANCE: rendered-dom · components-modal--default, --danger-modal,
       --passive-modal and composedmodal--default, plus the xs, sm and lg
       recipes, 2026-08-28 -->
  <!--
    THE CLOSE BUTTON HAS TWO WRAPPERS IN THE REFERENCE AND THIS FRAGMENT KEPT
    NEITHER, which was a defect rather than a decision. `modal-close-button` is
    `position: absolute; inset-block-start: 0; inset-inline-end: 0` — it is what
    pins the X to the header's top-right corner, against the `position: fixed`
    container, into the 3rem the header's `padding-inline: 1rem 3rem` reserves
    for it. Without it the button sat in the flow directly under the heading,
    left-aligned, with the reserved gutter empty beside it. Found by looking at
    the rendered page, which is the README's point about what no gate catches.

    The SECOND wrapper is still declined: the reference nests the button in an
    icon-tooltip's `tooltip-trigger__wrapper` for a hover hint, which the sink
    passes on for the same reason it does on combo-button and the table's
    overflow trigger — the positioning is floating-ui JS.

    The reference also carries `btn btn--primary btn--icon-only` on the button
    itself. They are declined too, and this one is measured rather than assumed:
    `modal-close` sets its own 3rem box, transparent background and padding, and
    is emitted after `button` in the manifest, so the btn classes contribute
    nothing but a chance for the cascade to change under a Carbon bump.
  -->
  <!--
    .rux--modal is position:fixed at 100vw/100vh. Constraining it to a box
    misrepresents the component, so it is triggered instead: `.is-visible` on a
    modal WITHOUT `--enable-presence` is Carbon's own show hook.

    `layer-one` on the root is Carbon's, and it is not decoration: it re-declares
    the whole --rux-layer-* group at layer-01, so a modal opened from inside a
    layer-two region still renders as layer-one. At the sink's top level it
    resolves to what :root already had, which is why its absence was invisible —
    check-ancestry found it, not the page.

    THE TRIGGERS ARE THE REAL BEHAVIOUR LAYER, not the sink harness — js/modal.js
    on top of js/overlay.js (Phase 5). `data-rux-open="<id>"` opens, anything
    with `data-rux-close` inside a modal closes, and focus trapping, Escape and
    backdrop press come from the kernel. This is what a page built from a
    template gets, with no script of its own.
  -->
  <div class="ks-row">
    <button type="button" class="rux--btn rux--btn--primary" data-rux-open="modal-sm">Open small modal</button>
    <button type="button" class="rux--btn rux--btn--secondary" data-rux-open="modal-lg">Open large modal</button>
    <button type="button" class="rux--btn rux--btn--tertiary" data-rux-open="modal-xs">Open xs modal</button>
  </div>

  <div class="rux--layer-one rux--modal" id="modal-xs" role="dialog" aria-modal="true" aria-labelledby="modal-xs-h">
    <div class="rux--modal-container rux--modal-container--xs">
      <div class="rux--modal-header">
        <h2 class="rux--modal-header__heading" id="modal-xs-h">Sign out?</h2>
        <div class="rux--modal-close-button">
          <button type="button" class="rux--modal-close" aria-label="Close" data-rux-close>
            <svg class="rux--modal-close__icon" width="20" height="20" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><use href="#i-close"/></svg>
          </button>
        </div>
      </div>
      <div class="rux--modal-content"><p>You will need to sign in again.</p></div>
      <div class="rux--modal-footer">
        <button type="button" class="rux--btn rux--btn--secondary" data-rux-close>Stay</button>
        <button type="button" class="rux--btn rux--btn--primary" data-rux-close>Sign out</button>
      </div>
    </div>
  </div>

  <div class="rux--layer-one rux--modal" id="modal-sm" role="dialog" aria-modal="true" aria-labelledby="modal-sm-h">
    <div class="rux--modal-container rux--modal-container--sm">
      <div class="rux--modal-header">
        <h2 class="rux--modal-header__label">Optional label</h2>
        <h2 class="rux--modal-header__heading" id="modal-sm-h">Delete this record?</h2>
        <div class="rux--modal-close-button">
          <button type="button" class="rux--modal-close" aria-label="Close" data-rux-close>
            <svg class="rux--modal-close__icon" width="20" height="20" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><use href="#i-close"/></svg>
          </button>
        </div>
      </div>
      <div class="rux--modal-content">
        <p>This cannot be undone. The record and its history are removed permanently.</p>
      </div>
      <div class="rux--modal-footer">
        <button type="button" class="rux--btn rux--btn--secondary" data-rux-close>Cancel</button>
        <button type="button" class="rux--btn rux--btn--danger" data-rux-close>Delete</button>
      </div>
    </div>
  </div>

  <div class="rux--layer-one rux--modal" id="modal-lg" role="dialog" aria-modal="true" aria-labelledby="modal-lg-h">
    <div class="rux--modal-container rux--modal-container--lg">
      <div class="rux--modal-header">
        <h2 class="rux--modal-header__heading" id="modal-lg-h">Large container</h2>
        <div class="rux--modal-close-button">
          <button type="button" class="rux--modal-close" aria-label="Close" data-rux-close>
            <svg class="rux--modal-close__icon" width="20" height="20" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><use href="#i-close"/></svg>
          </button>
        </div>
      </div>
      <div class="rux--modal-content"><p>A wider modal for denser content.</p></div>
      <div class="rux--modal-footer">
        <button type="button" class="rux--btn rux--btn--secondary" data-rux-close>Cancel</button>
        <button type="button" class="rux--btn rux--btn--primary" data-rux-close>Confirm</button>
      </div>
    </div>
  </div>
</section>
