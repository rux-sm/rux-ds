<section class="ks-sec" id="modal">
  <h2>Modal</h2><p>sizes · danger footer — opens full-viewport, as Carbon renders it</p>
  <!-- PROVENANCE: rendered-dom · components-modal--default, --danger-modal,
       --passive-modal and composedmodal--default, plus the xs, sm and lg
       recipes, 2026-08-28 -->
  <!--
    One finding recorded: `modal-close` sits directly in `__header` here, where
    the reference wraps it in an icon-tooltip's `tooltip-trigger__wrapper`.
    That is the story's hover hint, which the sink declines on the combo-button
    precedent; the close button's own placement in the header is unchanged.
  -->
  <!--
    .rux--modal is position:fixed at 100vw/100vh. Constraining it to a box
    misrepresents the component, so it is triggered instead: `.is-visible` on a
    modal WITHOUT `--enable-presence` is Carbon's own show hook (css/rux.css:18838).
    Harness JS at the bottom of the page wires the triggers.
  -->
  <div class="ks-row">
    <button type="button" class="rux--btn rux--btn--primary" data-ks-open="modal-sm">Open small modal</button>
    <button type="button" class="rux--btn rux--btn--secondary" data-ks-open="modal-lg">Open large modal</button>
    <button type="button" class="rux--btn rux--btn--tertiary" data-ks-open="modal-xs">Open xs modal</button>
  </div>

  <div class="rux--modal" id="modal-xs" role="dialog" aria-modal="true" aria-labelledby="modal-xs-h">
    <div class="rux--modal-container rux--modal-container--xs">
      <div class="rux--modal-header">
        <h2 class="rux--modal-header__heading" id="modal-xs-h">Sign out?</h2>
        <button type="button" class="rux--modal-close" aria-label="Close" data-ks-close>
          <svg class="rux--modal-close__icon" width="20" height="20" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><use href="#i-close"/></svg>
        </button>
      </div>
      <div class="rux--modal-content"><p>You will need to sign in again.</p></div>
      <div class="rux--modal-footer">
        <button type="button" class="rux--btn rux--btn--secondary" data-ks-close>Stay</button>
        <button type="button" class="rux--btn rux--btn--primary" data-ks-close>Sign out</button>
      </div>
    </div>
  </div>

  <div class="rux--modal" id="modal-sm" role="dialog" aria-modal="true" aria-labelledby="modal-sm-h">
    <div class="rux--modal-container rux--modal-container--sm">
      <div class="rux--modal-header">
        <h2 class="rux--modal-header__label">Optional label</h2>
        <h2 class="rux--modal-header__heading" id="modal-sm-h">Delete this record?</h2>
        <button type="button" class="rux--modal-close" aria-label="Close" data-ks-close>
          <svg class="rux--modal-close__icon" width="20" height="20" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><use href="#i-close"/></svg>
        </button>
      </div>
      <div class="rux--modal-content">
        <p>This cannot be undone. The record and its history are removed permanently.</p>
      </div>
      <div class="rux--modal-footer">
        <button type="button" class="rux--btn rux--btn--secondary" data-ks-close>Cancel</button>
        <button type="button" class="rux--btn rux--btn--danger" data-ks-close>Delete</button>
      </div>
    </div>
  </div>

  <div class="rux--modal" id="modal-lg" role="dialog" aria-modal="true" aria-labelledby="modal-lg-h">
    <div class="rux--modal-container rux--modal-container--lg">
      <div class="rux--modal-header">
        <h2 class="rux--modal-header__heading" id="modal-lg-h">Large container</h2>
        <button type="button" class="rux--modal-close" aria-label="Close" data-ks-close>
          <svg class="rux--modal-close__icon" width="20" height="20" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><use href="#i-close"/></svg>
        </button>
      </div>
      <div class="rux--modal-content"><p>A wider modal for denser content.</p></div>
      <div class="rux--modal-footer">
        <button type="button" class="rux--btn rux--btn--secondary" data-ks-close>Cancel</button>
        <button type="button" class="rux--btn rux--btn--primary" data-ks-close>Confirm</button>
      </div>
    </div>
  </div>
</section>
