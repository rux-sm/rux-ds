<section class="ks-sec" id="tooltip">
  <h2>Tooltip</h2><p>open state · definition variant — click a trigger</p>
  <!--
    .rux--tooltip--visible has no CSS rule. Visibility comes from the popover
    mechanism: .rux--popover--open > .rux--popover > .rux--popover-content.
  -->
  <div class="ks-row" style="gap:6rem;padding:4rem 0 5rem 8rem">
    <span class="rux--tooltip rux--popover-container rux--popover--bottom rux--popover--caret">
      <button type="button" class="rux--btn rux--btn--tertiary rux--btn--sm rux--tooltip__trigger">Trigger</button>
      <span class="rux--popover">
        <span class="rux--popover-content rux--tooltip-content">Tooltip content</span>
        <span class="rux--popover-caret"></span>
      </span>
    </span>

    <span class="rux--tooltip rux--popover-container rux--popover--top rux--popover--caret">
      <button type="button" class="rux--btn rux--btn--tertiary rux--btn--sm rux--tooltip__trigger">Top</button>
      <span class="rux--popover">
        <span class="rux--popover-content rux--tooltip-content">Above the trigger</span>
        <span class="rux--popover-caret"></span>
      </span>
    </span>

    <span class="rux--tooltip rux--tooltip--definition rux--popover-container rux--popover--bottom">
      <button type="button" class="rux--definition-term">Defined term</button>
      <span class="rux--popover">
        <span class="rux--popover-content rux--tooltip-content rux--tooltip--definition__bottom">The definition of the term.</span>
      </span>
    </span>
  </div>
</section>
