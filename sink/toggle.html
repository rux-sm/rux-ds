<section class="ks-sec" id="toggle">
  <h2>Toggle</h2><p>on · off · small (the only size with a checkmark) · disabled</p>
  <!--
    Carbon's _renderCheckmark() returns early unless size === "sm"
    (web-components/toggle/toggle.js). The checkmark belongs to the SMALL toggle
    only; .rux--toggle__check is positioned for that variant, so putting it on the
    default size lands it off-centre. SVG is Carbon's own: 6x5, viewBox 0 0 6 5.
  -->
  <div class="ks-row" style="gap:3rem">
    <div class="rux--toggle">
      <button id="tg-1" class="rux--toggle__button" role="switch" type="button" aria-checked="true" aria-labelledby="tg-1-l"></button>
      <label class="rux--toggle__label" for="tg-1" id="tg-1-l">
        <span class="rux--toggle__label-text">On</span>
        <div class="rux--toggle__appearance">
          <div class="rux--toggle__switch rux--toggle__switch--checked"></div>
          <div class="rux--toggle__text">On</div>
        </div>
      </label>
    </div>

    <div class="rux--toggle">
      <button id="tg-2" class="rux--toggle__button" role="switch" type="button" aria-checked="false" aria-labelledby="tg-2-l"></button>
      <label class="rux--toggle__label" for="tg-2" id="tg-2-l">
        <span class="rux--toggle__label-text">Off</span>
        <div class="rux--toggle__appearance">
          <div class="rux--toggle__switch"></div>
          <div class="rux--toggle__text">Off</div>
        </div>
      </label>
    </div>

    <div class="rux--toggle">
      <button id="tg-3" class="rux--toggle__button" role="switch" type="button" aria-checked="true" aria-labelledby="tg-3-l"></button>
      <label class="rux--toggle__label" for="tg-3" id="tg-3-l">
        <span class="rux--toggle__label-text">Small · checked</span>
        <div class="rux--toggle__appearance rux--toggle__appearance--sm">
          <div class="rux--toggle__switch rux--toggle__switch--checked">
            <svg class="rux--toggle__check" width="6px" height="5px" viewBox="0 0 6 5"><path d="M2.2 2.7L5 0 6 1 2.2 5 0 2.7 1 1.5z"/></svg>
          </div>
        </div>
      </label>
    </div>

    <div class="rux--toggle">
      <button id="tg-5" class="rux--toggle__button" role="switch" type="button" aria-checked="false" aria-labelledby="tg-5-l"></button>
      <label class="rux--toggle__label" for="tg-5" id="tg-5-l">
        <span class="rux--toggle__label-text">Small · off</span>
        <div class="rux--toggle__appearance rux--toggle__appearance--sm">
          <div class="rux--toggle__switch"></div>
        </div>
      </label>
    </div>

    <div class="rux--toggle rux--toggle--disabled">
      <button id="tg-4" class="rux--toggle__button" role="switch" type="button" aria-checked="false" disabled aria-labelledby="tg-4-l"></button>
      <label class="rux--toggle__label" for="tg-4" id="tg-4-l">
        <span class="rux--toggle__label-text">Disabled</span>
        <div class="rux--toggle__appearance">
          <div class="rux--toggle__switch"></div>
          <div class="rux--toggle__text">Off</div>
        </div>
      </label>
    </div>
  </div>
</section>
