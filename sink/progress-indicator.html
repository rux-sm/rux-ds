<section class="ks-sec" id="progress-indicator">
  <h2>Progress indicator</h2><p>horizontal · vertical · step states</p>
  <!-- PROVENANCE: inferred · structure read off CSS selectors, never diffed against a reference -->
  <ul class="rux--progress rux--progress--space-equal" style="margin-block-end:2rem">
    <li class="rux--progress-step rux--progress-step--complete">
      <div class="rux--progress-step-button">
        <svg width="16" height="16" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><use href="#i-checkmark--outline"/></svg>
        <p class="rux--progress-label">Details</p>
      </div>
    </li>
    <li class="rux--progress-step rux--progress-step--current">
      <div class="rux--progress-step-button">
        <svg width="16" height="16" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><use href="#i-incomplete"/></svg>
        <p class="rux--progress-label">Review</p>
        <p class="rux--progress-optional">Optional</p>
      </div>
    </li>
    <li class="rux--progress-step rux--progress-step--incomplete">
      <div class="rux--progress-step-button">
        <svg width="16" height="16" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><use href="#i-circle-dash"/></svg>
        <p class="rux--progress-label">Confirm</p>
      </div>
    </li>
    <li class="rux--progress-step rux--progress-step--incomplete rux--progress-step--disabled" aria-disabled="true">
      <div class="rux--progress-step-button">
        <svg width="16" height="16" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><use href="#i-circle-dash"/></svg>
        <p class="rux--progress-label">Publish</p>
      </div>
    </li>
  </ul>
  <ul class="rux--progress rux--progress--vertical">
    <li class="rux--progress-step rux--progress-step--complete">
      <div class="rux--progress-step-button"><svg width="16" height="16" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><use href="#i-checkmark--outline"/></svg><p class="rux--progress-label">One</p></div>
    </li>
    <li class="rux--progress-step rux--progress-step--current">
      <div class="rux--progress-step-button"><svg width="16" height="16" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><use href="#i-incomplete"/></svg><p class="rux--progress-label">Two</p></div>
    </li>
  </ul>
</section>
