name: gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A second push supersedes the first; nothing is learned from finishing the stale run.
concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 so the control-file notice below has a base commit to
      # diff against. A shallow clone has HEAD and nothing to compare it with.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The floor declared in package.json engines, not the version this is
      # developed on (26.x). CI proves the lower bound is honest; developing
      # above it cannot.
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      # --ignore-scripts: every @carbon/* and @ibm/plex package runs an
      # `ibmtelemetry` postinstall. Nothing in the build path needs a postinstall
      # — dart-sass ships as JavaScript, and @parcel/watcher is reached only by
      # `npm run watch` — so skipping them keeps CI quiet, offline and identical
      # across npm versions, which differ on whether they run scripts by default.
      - run: npm ci --ignore-scripts

      # The gates. Defined once in package.json, so adding a checker there adds
      # it here — there is no second list to drift out of sync.
      #
      # `verify` chains with &&, so it stops at the first failing gate rather
      # than reporting all of them. That is deliberate: the gates are ordered by
      # dependency, and a failed build makes every later checker meaningless.
      - run: npm run verify

      # Names any control this push or PR touched — a gate, the registry, a
      # baseline, this workflow, the commit hook, an instruction file.
      #
      # IT DOES NOT BLOCK, AND THAT IS THE DESIGN. CI runs the gates from the
      # same commit that changed them, so a weakened gate certifies itself here;
      # a blocking check would be a claim this repository cannot honour, and one
      # maintainer has nowhere to escalate to. See tools/lib/gates.mjs
      # CONTROL_FILES and adoption-audit.md. `continue-on-error` covers the
      # first commit on a branch, where the base ref does not resolve.
      - name: Control files touched
        continue-on-error: true
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "No base commit to diff against — skipping the control notice."
          else
            node tools/check-controls.mjs "$BASE"
          fi

      # The build writes tracked files. css/rux.css, css/rux.min.css,
      # kitchen-sink.html and portal.html are committed so the system is
      # consumable from a raw URL with no build step — which only holds while they match their
      # sources. A clean tree after `verify` is the proof.
      #
      # assets/icons.svg is deliberately excluded: `npm run icons` quarries
      # @carbon/icons, which is not a declared dependency, so CI cannot rebuild
      # the sprite to compare against.
      - name: Committed build output is up to date
        run: |
          if ! git diff --quiet -- css kitchen-sink.html portal.html; then
            echo "::error::Committed build output is stale — run 'npm run verify' and commit the result."
            git diff --stat -- css kitchen-sink.html portal.html
            exit 1
          fi
