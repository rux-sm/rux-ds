name: pages

# Publishes this repository at https://rux-sm.github.io/rux-ds/ — the design
# system as an app on the platform, alongside Notes and Scheduler.
#
# WHY THIS REPOSITORY AND NOT A SITE REPOSITORY. Every other module vendors
# rux-ds at a pinned tag into vendor/rux-ds/. rux-ds cannot vendor itself, and
# builder.html and theme-creator.html are live tools: they need the real css/,
# js/, builder/ and theme-creator/, not a copy. A separate site repository
# would have to duplicate exactly what this repository exists to stop being
# duplicated. So the site is this tree.
#
# IT DEPLOYS ON A TAG, AND CHECKS ITS CONSUMERS FIRST -- roadmap §8.4 diff B,
# decided by rux in §8.6 on 2026-09-09. Until then it deployed on every push
# to main and was the one app on the platform not on a tag. Now an app that
# links /rux-ds/ on the shared origin (the scheduler since §8.4 step 2) reads
# whatever this deploys, so what this deploys is a release: cutting a tag IS
# the roll-out, and nothing right of the tag moves until one is cut. gates.yml
# still checks every push; only the deploy waits. workflow_dispatch stays for
# two uses -- redeploying an older tag (the rollback: run this workflow at
# that tag) and rehearsing -- and the stamp says which it was.
#
# THE consumers JOB IS THE CONTROL THAT REPLACES THE PIN. A vendored app had a
# checksum saying "these are the tag's bytes"; a served app has no bytes of
# its own, so the question moves here: does every served consumer's page
# still pass the shared check against THIS tree? A class that left while an
# app uses it fails that job, and the deploy needs it. An app that still
# vendors is reported NOT RUN with its pin -- it loads its own copy, and a
# green line for a check that did not run is what tools/app-check.mjs
# exists to refuse. It is checked here the day it moves (§8.4 step 5).
#
# THE CHECK IS npm run verify, THE SAME ONE gates.yml RUNS. It is defined once
# in package.json, so a new gate is picked up here with no second list. This
# workflow runs it AGAIN rather than depending on gates.yml: a workflow_run
# trigger deploys from a ref resolved separately from the run that passed, and
# a design system serving a page its own gates never saw is the one failure
# this is meant to prevent. The cost is one duplicated run per tag.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# WIDER THAN gates.yml, WHICH HAS contents: read AND NOTHING ELSE. Deploying to
# Pages needs pages: write and id-token: write, and that is a real privilege
# increase for this repository's Actions — recorded here because it is the kind
# of change that is invisible once it is normal.
permissions:
  contents: read
  pages: write
  id-token: write

# A second push supersedes the first. cancel-in-progress is safe on the deploy
# because the deployment itself is atomic: the last completed one keeps serving.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # The gates, exactly as gates.yml runs them. If this fails nothing deploys and
  # the previous deployment keeps serving, so a broken main is in git but not on
  # the web.
  #
  # WHAT THIS DOES NOT COVER, said plainly: the five BROWSER gates —
  # check-a11y, check-rendered, check-runtime-classes, check-spacing and
  # check-behaviour — are not in `verify` and cannot run here. `npm run gates`
  # reports whether their readings are current and DOES NOT FAIL, by design
  # (tools/lib/gates.mjs). So a push can go live with every browser reading
  # stale. That was already true of the repository; publishing makes it public.
  check:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0, AND IT IS LORE-BEARING. The first run of this workflow
      # failed here with a 90-line portal.html diff while gates.yml passed on
      # the same commit, and the only difference between them was this line.
      # build-portal stamps each browser-gate cell by resolving the commit its
      # reading was recorded at; a depth-1 clone has one commit, so NOTHING
      # resolves and every cell regenerates as "not current" — 0 of 44 against
      # the committed 44 of 44. Reproduced locally with `git clone --depth 1`
      # before this line was written, not inferred from the log.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      # --ignore-scripts for the same reason gates.yml gives: every @carbon/*
      # and @ibm/plex package runs an ibmtelemetry postinstall, and nothing in
      # the build path needs one.
      - run: npm ci --ignore-scripts

      - run: npm run verify

      # The build writes tracked files, and a deploy from a tree whose committed
      # output is stale would serve a page that does not match its own source.
      # Same list gates.yml checks.
      - name: Committed build output is up to date
        run: |
          if ! git diff --quiet -- css kitchen-sink.html portal.html README.md builder/blocks.json builder.html docs/builder-coverage.md theme-creator.html theme-creator/families.json; then
            echo "::error::Committed build output is stale — run 'npm run verify' and commit the result."
            git diff --stat -- css kitchen-sink.html portal.html README.md builder/blocks.json builder.html docs/builder-coverage.md theme-creator.html theme-creator/families.json
            exit 1
          fi

  # EVERY SERVED CONSUMER, AGAINST THIS TREE. Three public checkouts at their
  # main; each is either served (no vendor/) and checked with --ds pointing at
  # this tree and --hub at the account-root checkout, or vendored and reported
  # NOT RUN with the tag its PIN names. A consumer that fails to check out
  # fails the job: continue-on-error is not used, because a check that can be
  # skipped is not a gate. --ds is ABSOLUTE on purpose -- app-check resolves a
  # relative --ds against the app, so `--ds .` would name the app itself;
  # measured 2026-09-09 before this was written, not inferred.
  consumers:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: rux-sm/rux-sm.github.io
          path: consumers/rux-sm.github.io
      - uses: actions/checkout@v7
        with:
          repository: rux-sm/rux-ln-notes
          path: consumers/rux-ln-notes
      - uses: actions/checkout@v7
        with:
          repository: rux-sm/rux-scheduler
          path: consumers/rux-scheduler
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Every served consumer passes the shared check against this tree
        run: |
          hub="$PWD/consumers/rux-sm.github.io"
          fail=0
          for app in rux-sm.github.io rux-ln-notes rux-scheduler; do
            dir="$PWD/consumers/$app"
            echo "::group::$app"
            if [ -d "$dir/vendor/rux-ds" ]; then
              echo "  ---- NOT RUN: $app vendors rux-ds at $(awk '/^tag/{print $2}' "$dir/vendor/rux-ds/PIN") and loads that copy, not this tree. Checked here the day it moves (roadmap §8.4 step 5)."
            else
              node tools/app-check.mjs "$dir" --ds "$PWD" --hub "$hub" || fail=1
              DS="$PWD" node tools/drift.mjs "$dir" || true
            fi
            echo "::endgroup::"
          done
          if [ "$fail" = 1 ]; then echo "::error::A served consumer fails the shared check against this tree. This tag does not deploy."; fi
          exit $fail

  deploy:
    needs: [check, consumers]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # A FRESH CHECKOUT, not an artifact from the check job. The check job has
      # node_modules in it after npm ci, and the published site must be the
      # committed tree and nothing else. Nothing is built here: css/rux.css,
      # the four generated pages and builder/blocks.json are committed, which
      # is the same property that lets a consumer fetch them from a raw URL.
      #
      # DEPTH 1 IS RIGHT HERE, unlike in the check job above: nothing is
      # regenerated, so no gate stamp has to resolve, and the build stamp below
      # reads HEAD alone.
      - uses: actions/checkout@v7

      # THE BUILD STAMP. index.html ships the placeholder "the working tree",
      # which is the honest answer when the page is served from a checkout.
      # Substituted HERE and never committed: a stamp written into the file at
      # build time would leave index.html dirty after every single commit, the
      # churn portal.html avoids by changing only when its data does.
      #
      # THE TAG COMES FROM THE REF, NOT FROM git describe: this is a depth-1
      # checkout with no tag list, and describe would name nothing. On a tag
      # push the ref IS the tag. A workflow_dispatch from a branch stamps the
      # branch and says it is not a release, so a rehearsal cannot pass for one.
      - name: Stamp the release onto the home page
        run: |
          SHA="$(git rev-parse --short HEAD)"
          DATE="$(git log -1 --format=%cs)"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            LABEL="tag <code>${GITHUB_REF_NAME}</code> (<code>${SHA}</code>), ${DATE}"
          else
            LABEL="branch <code>${GITHUB_REF_NAME}</code>, commit <code>${SHA}</code>, ${DATE} &mdash; not a release"
          fi
          sed -i "s|<span id=\"build-commit\">the working tree</span>|<span id=\"build-commit\">${LABEL}</span>|" index.html
          grep -qE "id=\"build-commit\">(tag|branch) " index.html || { echo "::error::The build stamp did not substitute — index.html's placeholder has moved."; exit 1; }

      # NEITHER BELONGS ON A WEB SERVER, and the upload action tars whatever it
      # is given. .git is the whole history at every push; .github is workflow
      # definitions. Removing them from the checkout is local to this runner.
      # consumers/ is not in this checkout -- the consumers job's checkouts
      # live on its own runner -- but is named here so that never changes
      # silently.
      - name: Drop what is not the site
        run: rm -rf .git .github consumers

      - uses: actions/configure-pages@v5

      # The tree itself. sink/ is included on purpose — 69 component fragments
      # that portal.html's Reference column can point at — and so are
      # templates/, docs/ and the captures, all of which are already public in
      # the repository and cost nothing to serve.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
